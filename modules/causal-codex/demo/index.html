<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>因果法典 · 独立MVU测试页</title>
<style>body{margin:0;background:#070709;color:#e8dcc3;font:14px/1.6 system-ui;padding:12px}header,.test-controls,#chat,.input-bridge{max-width:440px;margin:0 auto}h1{font-size:18px;color:#efd58b}small{color:#afa091}.test-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.test-controls button{min-height:44px;background:#19131b;border:1px solid #6c5331;border-radius:8px;color:#e8dcc3;padding:7px 10px;font:inherit;font-size:12px}textarea{width:100%;box-sizing:border-box;min-height:100px;background:#121015;color:#e8dcc3;border:1px solid #59462e;border-radius:8px;padding:10px;margin-top:10px}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.mes_text>p{font-size:13px;color:#b8aa98}a{color:#efd58b}</style></head>
<body><header><h1>因果法典 · MVU独立验证</h1><p>仅含 mock 状态与冻结媒体；不读取或写入角色卡、世界书。</p></header>
<div class="test-controls"><button data-demo="baseline">45 / 20 · mock基线</button><button data-demo="cross">下一回合 · 跨多阈值</button><button data-demo="settle">正文确认死亡</button><button data-demo="repeat">刷新同一回合</button><button data-demo="reset">重置mock测试</button></div>
<div id="chat"><div class="mes" mesid="1"><div class="mes_text"><p>独立测试场景：鲁迪在场，日常 / 饮食；数值直接来自 mock causality。</p></div></div></div>
<div class="input-bridge"><label for="send_textarea">输入框桥（本页没有发送功能）</label><textarea id="send_textarea" placeholder="点击死亡签提示，只填充，不发送"></textarea><details><summary>Mock机械态诊断</summary><pre id="diagnostics"></pre></details></div>
<script type="module" src="./mock.js"></script></body></html>
